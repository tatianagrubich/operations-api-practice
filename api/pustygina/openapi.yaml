openapi: 3.0.3
info:
  title: BankingReadApi
  version: 1.0.0
  description: Ленты истории операций
  contact:
    name: Учебная команда А, Пустыгина Ирина
    email: pustygina@vtb.ru
    url: 'https://github.com/tatianagrubich/operations-api-practice'

servers:
  - url: https://api.example.com/api/banking/v1
    description: Общий адрес API. Хост задаётся при развёртывании.

security:
  - BearerAuth: []

paths:
  /accounts:
    get:
      tags:
        - Счета
      operationId: getAccounts
      summary: Получить счета клиента
      description: Возвращает список счетов клиента.
      responses:
        "200":
          description: >
            Список счетов клиента. Если счетов нет, возвращается пустой массив items.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: "#/components/schemas/Account"
        "401":
          description: Отсутствует или недействителен токен авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Недостаточно прав для доступа к данным
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accounts/{accountId}/operations:
    get:
      tags:
        - Операции
      operationId: getAccountOperations
      summary: Получить операции счёта
      description: Возвращает страницу операций указанного счёта с фильтрами и пагинацией.
      parameters:
        - name: accountId
          in: path
          required: true
          description: Идентификатор счёта
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[A-Za-z0-9_-]+$"

        - name: offset
          in: query
          required: false
          description: Число записей, которое нужно пропустить
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0

        - name: limit
          in: query
          required: false
          description: Максимальное число записей в ответе
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: status
          in: query
          required: false
          description: Фильтр по статусу операции
          schema:
            type: string
            maxLength: 7
            enum:
              - HOLD
              - SETTLED

        - name: startDate
          in: query
          required: false
          description: Начало периода включительно в формате RFC 3339 date-time
          schema:
            type: string
            format: date-time
            maxLength: 35

        - name: endDate
          in: query
          required: false
          description: Конец периода включительно в формате RFC 3339 date-time
          schema:
            type: string
            format: date-time
            maxLength: 35

        - name: categoryText
          in: query
          required: false
          description: Фильтр по названию категории
          schema:
            type: string
            minLength: 1
            maxLength: 100

      responses:
        "200":
          description: Страница операций счёта
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/OperationListItem"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

        "400":
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Отсутствует или недействителен токен авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Недостаточно прав для доступа к данным
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Счёт не найден или недоступен клиенту
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accounts/{accountId}/operations/{operationId}:
    get:
      tags:
        - Операции
      operationId: getAccountOperation
      summary: Получить детали операции счёта
      description: Возвращает подробную информацию об операции указанного счёта.
      parameters:
        - name: accountId
          in: path
          required: true
          description: Идентификатор счёта
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[A-Za-z0-9_-]+$"

        - name: operationId
          in: path
          required: true
          description: Идентификатор операции
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[A-Za-z0-9_-]+$"

      responses:
        "200":
          description: Детали операции
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationDetail"
        "401":
          description: Отсутствует или недействителен токен авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Недостаточно прав для доступа к данным
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Счёт не найден или операция не найдена среди операций этого счёта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /operations:
    get:
      tags:
        - Операции
      operationId: getOperationsForCrm
      summary: Получить список операций для CRM
      description: Возвращает страницу операций для CRM с фильтрами и пагинацией.
      parameters:
        - name: accountId
          in: query
          required: false
          description: Фильтр по идентификатору счёта
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[A-Za-z0-9_-]+$"

        - name: offset
          in: query
          required: false
          description: Число записей, которое нужно пропустить
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0

        - name: limit
          in: query
          required: false
          description: Максимальное число записей в ответе
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: status
          in: query
          required: false
          description: Фильтр по статусу операции
          schema:
            type: string
            maxLength: 7
            enum:
              - HOLD
              - SETTLED

        - name: startDate
          in: query
          required: false
          description: Начало периода включительно в формате RFC 3339 date-time
          schema:
            type: string
            format: date-time
            maxLength: 35

        - name: endDate
          in: query
          required: false
          description: Конец периода включительно в формате RFC 3339 date-time
          schema:
            type: string
            format: date-time
            maxLength: 35

        - name: categoryText
          in: query
          required: false
          description: Фильтр по названию категории
          schema:
            type: string
            minLength: 1
            maxLength: 100

      responses:
        "200":
          description: Страница операций
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/OperationListItem"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

        "400":
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Отсутствует или недействителен токен авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Недостаточно прав для доступа к данным
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Переданный accountId не найден или недоступен CRM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Account:
      type: object
      additionalProperties: false
      required:
        - accountId
        - currency
        - accountNumber
      properties:
        accountId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: "^[A-Z]{3}$"
        accountNumber:
          type: string
          minLength: 20
          maxLength: 20
          pattern: "^[0-9]{5}\\*{11}[0-9]{4}$"
          description: >
            Маскированный номер счёта: первые 5 и последние 4 символа исходного
            значения показаны, середина заменена звёздочками.

    OperationListItem:
      type: object
      additionalProperties: false
      required:
        - operationId
        - status
        - operationDateTime
        - accountId
        - accountNumber
        - amountValue
        - amountCurrency
      properties:
        operationId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        status:
          type: string
          maxLength: 7
          enum:
            - HOLD
            - SETTLED
        statusDescription:
          type: string
          minLength: 1
          maxLength: 200
        operationDateTime:
          type: string
          format: date-time
          maxLength: 35
        accountId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        accountNumber:
          type: string
          minLength: 20
          maxLength: 20
          pattern: "^[0-9]{5}\\*{11}[0-9]{4}$"
        merchantName:
          type: string
          minLength: 1
          maxLength: 200
        categoryText:
          type: string
          minLength: 1
          maxLength: 100
        amountValue:
          type: number
          minimum: -1000000000000
          maximum: 1000000000000
        amountCurrency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: "^[A-Z]{3}$"

    Pagination:
      type: object
      additionalProperties: false
      required:
        - offset
        - limit
        - total
      properties:
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          maximum: 1000000000

    OperationDetail:
      type: object
      additionalProperties: false
      required:
        - account
        - operation
      properties:
        account:
          type: object
          additionalProperties: false
          required:
            - accountId
            - currency
            - accountNumber
          properties:
            accountId:
              type: string
              minLength: 1
              maxLength: 64
              pattern: "^[A-Za-z0-9_-]+$"
            currency:
              type: string
              minLength: 3
              maxLength: 3
              pattern: "^[A-Z]{3}$"
            accountNumber:
              type: string
              minLength: 20
              maxLength: 20
              pattern: "^[0-9]{5}\\*{11}[0-9]{4}$"
              description: Маскированный номер счёта.
        operation:
          type: object
          additionalProperties: false
          required:
            - operationId
            - amounts
            - status
          properties:
            operationId:
              type: string
              minLength: 1
              maxLength: 64
              pattern: "^[A-Za-z0-9_-]+$"
            amounts:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required:
                  - value
                  - currency
                properties:
                  value:
                    type: number
                    minimum: -1000000000000
                    maximum: 1000000000000
                  currency:
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: "^[A-Z]{3}$"
            merchant:
              type: string
              minLength: 1
              maxLength: 200
            categoryText:
              type: string
              minLength: 1
              maxLength: 100
            status:
              type: string
              maxLength: 7
              enum:
                - HOLD
                - SETTLED
            statusDescription:
              type: string
              minLength: 1
              maxLength: 200
            scoringDecision:
              type: object
              additionalProperties: false
              required:
                - code
                - description
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: "^[A-Za-z0-9_.-]+$"
                description:
                  type: string
                  minLength: 1
                  maxLength: 500

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_.-]+$"
        message:
          type: string
          minLength: 1
          maxLength: 500
