            serviceRequestId:
              type: string
              description: Идентификатор запроса на обслуживание
              minLength: 1
            agreementId:
              type: string
              description: Идентификатор договора
              minLength: 1
          required:
            - serviceRequestId
    RetailCarLoanParticipantResponse:
      title: RetailCarLoanParticipantResponse
      description: Данные лмд-объекта участников
      allOf:
