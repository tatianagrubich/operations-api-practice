              minLength: 1
            vin:
              type: string
              description: ВИН
              minLength: 1
          required:
            - vehicleId
    RetailCarLoanDealResponse:
      title: RetailCarLoanDealResponse
      description: Данные лмд-объекта сделки по автокредиту
      allOf:
