            retailCarLoanMoneyTransferInstructionObject:
              type: string
              description: Лмд-объект инструкции на перевод денежных средств
            moneyTransferInstructionId:
              type: string
              description: Идентификатор инструкции на перевод денежных средств
              minLength: 1
            serviceRequestExecutionPlanId:
              type: string
              description: Идентификатор плана исполнения по финансовой операции
              minLength: 1
            applicationId:
              type: string
              description: Идентификатор заявки
              minLength: 1              
          required:
            - moneyTransferInstructionId
            - serviceRequestExecutionPlanId
    RetailCarLoanProductInstanceTransactionResponse:
      title: RetailCarLoanProductInstanceTransactionResponse
      description: Данные лмд-объекта транзакции
      allOf:
        - $ref: '#/components/schemas/DataLmdObjectResponseDto'
        - type: object
          additionalProperties: false
          properties:
            retailCarLoanProductInstanceTransactionObject:
              type: string
              description: Лмд-объект транзакции
            productInstanceTransactionId:
              type: string
              description: Идентификатор транзакции
              minLength: 1              
            moneyTransferInstructionId:
              type: string
              description: Идентификатор инструкции на перевод денежных средств
              minLength: 1
            serviceRequestExecutionPlanId:
              type: string
              description: Идентификатор плана исполнения по финансовой операции
              minLength: 1            
          required:
            - productInstanceTransactionId         
            - moneyTransferInstructionId            
    LmdObjectsSearchingByBaseLmdObjectDto:
      title: LmdObjectsSearchingByBaseLmdObjectDto
      type: object
      description: Объект получения связанных лмд-объектов по Id базового лмд-объекта
      additionalProperties: false
      properties:
        baseObjectId:
          type: string
          description: Идентификатор базового объекта
          minLength: 1
        baseObjectType:
          type: string
          description: Тип базового объекта
          enum: [
            "RetailCarLoanApplication",
            "RetailCarLoanAgreement",
            "RetailCarLoanServiceRequest",
            "RetailCarLoanDeal",
            "RetailCarLoanLeadEventOnHookUp",
            "RetailCarLoanLead",
            "RetailCarLoanServiceRequestExecutionPlan",
            "RetailCarLoanMoneyTransferInstruction"            
          ]
        isObjectsRequiredInResponse:
          $ref: '#/components/schemas/IsObjectsRequiredInResponse'
        onlySaleProcessInvolved: 
          $ref: '#/components/schemas/OnlySaleProcessInvolved' 
        relatedTypesOfObjectsRequiredInResponse:
          type: array
          description: Массив типов связанных объектов ЛМД, инкременты последних версий которых требуются в ответе с базовым
          items:
            $ref: '#/components/schemas/LmdObjectType'
      required:
        - baseObjectId
        - baseObjectType
    DataLmdObjectResponseDto:
      title: DataLmdObjectResponseDto
      type: object
      description: 'Исходящий объект данных ЛМД-объекта'
      additionalProperties: false
      properties:
        lmdObjectType:
          $ref: '#/components/schemas/LmdObjectType'
        objectVersion:
          type: integer
          description: Версия объекта
        schemaVersion:
          type: string
          description: Версия схемы
          minLength: 1
        deletionDate:
          type: string
          format: date
          description: Дата удаления записи
        saleProcessInvolved:
          type: boolean
          description: Признак вовлечения инкремента ЛМД-объекта в процесс продажи
      discriminator:
        propertyName: lmdObjectType
        mapping:
          'RetailCarLoanApplication': '#/components/schemas/RetailCarLoanApplicationResponse'
          'RetailCarLoanAgreement': '#/components/schemas/RetailCarLoanAgreementResponse'
          'RetailCarLoanServiceRequest': '#/components/schemas/RetailCarLoanServiceRequestResponse'
          'RetailCarLoanParticipant': '#/components/schemas/RetailCarLoanParticipantResponse'
          'RetailCarLoanProductLoan': '#/components/schemas/RetailCarLoanProductLoanResponse'
          'RetailCarLoanCollateral': '#/components/schemas/RetailCarLoanCollateralResponse'
          'RetailCarLoanService': '#/components/schemas/RetailCarLoanServiceResponse'
          'RetailCarLoanProductInsurance': '#/components/schemas/RetailCarLoanProductInsuranceResponse'
          'RetailCarLoanVehicle': '#/components/schemas/RetailCarLoanVehicleResponse'
          'RetailCarLoanDeal': '#/components/schemas/RetailCarLoanDealResponse'
          'RetailCarLoanLeadEventOnHookUp': '#/components/schemas/RetailCarLoanLeadEventOnHookUpResponse'
          'RetailCarLoanLead': '#/components/schemas/RetailCarLoanLeadResponse'
          'RetailCarLoanEmployeeActionEventApplication': '#/components/schemas/RetailCarLoanEmployeeActionEventApplicationResponse'
          'RetailCarLoanEmployeeActionEventDeal': '#/components/schemas/RetailCarLoanEmployeeActionEventDealResponse'
