openapi: 3.0.1
info:
  title: 1388.alpp-comndatastorage-s-rest-v1
  version: 1.0.0
  description: API для работы с историей операций (Лента истории операций)
  contact:
    name: Anastasiay Mladsheva
    email: mladsheva.nastya@yandex.ru
    url: https://sfera.inno.local/knowledge/pages?id=1246094
servers:
  - url: 'http://localhost:8080/all/v1'
    description: LOCAL
tags:
  - name: operation
    description: операция
paths:
  /accounts/{accountId}/operations:
    get:
      summary: Метод получения истории операций счета
      operationId: getOperationsByAccountIdandFilters
      description: Метод для получения получения истории операций счета по фильтрам с пагинацией и сортировкой
      tags:
        - operation
      parameters:
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/startDate'
        - $ref: '#/components/parameters/endDate'
        - $ref: '#/components/parameters/categoryText'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/page'                                
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationListItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfoDto'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfoDto'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfoDto'
  /operations/{operationId}:
    get:
      summary: Метод получения деталей истории конкретной операции
      operationId: getOperation
      description: Метод для получения деталей истории конкретной операции по фильтрам
      tags:
        - operation  
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataLmdObjectResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfoDto'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfoDto'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfoDto'
components:
  parameters:
    accountId:
      name: accountId
      required: true
      in: path
      schema:
        type: string
      description: Идентификатор счет клиента
    operationId:
      name: operationId
      required: true
      in: path
      schema:
        type: string
      description: Идентификатор операции по счету 
    status:
      name: false
      required: true
      in: query
      schema:
        type: string
        enum: [
          "HOLD",
          "SETTLED"               
        ]        
      description: Статус операции
    startDate: 
      name: startDate
      required: false
      in: query
      schema:
        type: string
        format: date
      description: Начальный диапазон времени операции    
    endDate: 
      name: endDate
      required: false
      in: query
      schema:
        type: string
        format: date  
      description: Конечный диапазон времени операции                        
    categoryText:
      name: categoryText
      required: false
      in: query
      schema:
        type: string
      description: Категория трат  
  schemas:
    OperationListItem:
      title: OperationListItem
      description: Объект операции по счету клиента с ограниченной информацией
      type: object
      properties:
        accountId:
          type: string
          description: Идентификатор счета 
          minLength: 1
        status:
          type: string
          enum: [
            "HOLD",
            "SETTLED"               
          ] 
