              type: string
              description: Лмд-объект лида автокредита (подхват) в формате строки
            leadEventOnHookupId:
              type: string
              description: Идентификатор лида автокредита (подхват)
              minLength: 1
          required:
            - leadEventOnHookupId
    RetailCarLoanLeadResponse:
      title: RetailCarLoanLeadResponse
      description: Данные лмд-объекта лида автокредита
      allOf:
