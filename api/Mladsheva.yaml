              description: Лмд-объект действия сотрудника по сделке на автокредит в формате строки
            employeeActionEventDealId:
              type: string
              description: Идентификатор действия сотрудника по сделке на автокредит
              minLength: 1
            dealId:
              type: string
              description: Идентификатор сделки
              minLength: 1
          required:
            - employeeActionEventDealId
            - dealId
