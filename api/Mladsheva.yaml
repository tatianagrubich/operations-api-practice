              type: string
              description: Лмд-объект плана исполнения по финансовой операции
            serviceRequestExecutionPlanId:
              type: string
              description: Идентификатор плана исполнения по финансовой операции
              minLength: 1
            applicationId:
              type: string
              description: Идентификатор заявки
              minLength: 1
            serviceRequestId:
              type: string
              description: Идентификатор запроса на обслуживание
              minLength: 1
          required:
            - serviceRequestExecutionPlanId
