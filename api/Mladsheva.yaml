            retailCarLoanEmployeeActionEventApplicationObject:
              type: string
              description: Лмд-объект действия сотрудника по заявке на автокредит в формате строки
            employeeActionEventApplicationId:
              type: string
              description: Идентификатор действия сотрудника по заявке на автокредит
              minLength: 1
            applicationId:
              type: string
              description: Идентификатор заявки
              minLength: 1
          required:
