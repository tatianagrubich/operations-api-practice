            retailCarLoanLeadObject:
              type: string
              description: Лмд-объект лида автокредита в формате строки
            leadId:
              type: string
              description: Идентификатор лида
              minLength: 1
            leadEventOnHookupId:
              type: string
              description: Идентификатор лида автокредита (подхват)
              minLength: 1
          required:
            - leadId
            - leadEventOnHookupId
    RetailCarLoanEmployeeActionEventApplicationResponse:
      title: RetailCarLoanEmployeeActionEventApplicationResponse
      description: Данные лмд-объекта действия сотрудника по заявке на автокредит
      allOf:
