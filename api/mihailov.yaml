# =====================================================================
# ШАБЛОН OPENAPI 3.0 ДЛЯ ПРАКТИКИ
# Что делать: заполните секции paths и components, опираясь на ваш
# REST-дизайн (Занятие 1), разработанные ДТО (Занятие 2) и корпоративный стандарт REST.
# =====================================================================

openapi: 3.0.3

# ---------------------------------------------------------------------
# 1. МЕТАДАННЫЕ (п. 3.1, 3.2, 3.4)
# ---------------------------------------------------------------------
info:
  title: 1388.alpp-CoreBankAPI-s-rest-v1            # UpperCamelCase
  version: SemVer 1.0         # SemVer 2.0
  description: API для управления банковскими проводками и операциями        # Назначение, ограничения (GFM)
  contact:
    name: Mihailov Petr
    email: lockrise@gmail.com
    url: https://localhost:8080:api/core/core-main/v1

# ---------------------------------------------------------------------
# 2. СЕРВЕРЫ (п. 3.3, 3.4)
# ---------------------------------------------------------------------
# Формат: /{apim_path}/{base_path}/v{MAJOR}
# БЕЗ слэша на конце!
servers:
  - url: https://localhost:8080:api/core/core-main/v1 

# ---------------------------------------------------------------------
# 3. ТЕГИ (п. 3.14)
# ---------------------------------------------------------------------
# ВАЖНО: для кодогенерации нужен РОВНО ОДИН тег на операцию.
tags:
  - name: Postings          # Имя микросервиса
    description: Методы для управления  банковскими проводками
# ---------------------------------------------------------------------
# 4. ПУТИ (п. 3.6, 3.7, 3.8, 3.10)
# ---------------------------------------------------------------------
# Напоминания:
# - URL: snake_case / lisp-case, без глаголов, без слэша в конце
# - operationId: уникальный, lowerCamelCase
# - POST/PUT/PATCH: обязательный requestBody
# - В responses: успешные коды + обязательные ошибки
#   (400, 422, 404 если есть {id}, 429, 500, 503)
paths: 
  /postings:
    get:  
      tags: 
        - Postings
      operationId: GetPostings
      summary: Получение списка проводок
      parameters:
        - name: page
          in: query
          required: false       
          schema:
            type: integer
            format: int32
            maximum: 1000000
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            maximum: 1000000
            minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingListDTO'
    #   get:
  #     tags: [___]
  #     operationId: ___
  #     summary: ___
  #     parameters:
  #       - name: ___
  #         in: ___
  #         required: ___
  #         schema: ___
  #     responses:
  #       '200':
  #         description: ___
  #         content:
  #           application/json:
  #             schema:
  #               $ref: '#/components/schemas/___'
  #       '400': { $ref: '#/components/responses/BadRequest400' }
  #       '422': { $ref: '#/components/responses/UnprocessableEntity422' }
  #       '429': { $ref: '#/components/responses/TooManyRequests429' }
  #       '500': { $ref: '#/components/responses/InternalServerError500' }
  #       '503': { $ref: '#/components/responses/ServiceUnavailable503' }

# ---------------------------------------------------------------------
# 5. КОМПОНЕНТЫ (п. 3.6, 3.13, Раздел 4 — ФЛК)
# ---------------------------------------------------------------------
components:

  # --- Параметры (lowerCamelCase) ---
  # Path-параметры для {id}, query-параметры пагинации,
  # заголовки (например, для идемпотентности)
  parameters: {}

  # --- Схемы (UpperCamelCase) ---
  # Все DTO: Request, Response, List, Detail.
  #
  # ФЛК (Раздел 4):
  # - string: maxLength (255 по умолч.) или enum
  # - integer/number: minimum + maximum, format
  # - date: pattern; date-time: format + pattern
  # - object: additionalProperties: false
  # - array: items + maxItems
  #
  # НЕ используйте allOf для наследования List/Detail!
  # Разделяйте Request и Response.
  schemas: 
    PostingListDTO:
      description: Массив проводок
      type: array
      maxItems: 10000000
      items: 
        $ref: '#/components/schemas/PostingDTO'
      nullable: true

    PostingDTO:
      description: Информация о проводке
      type: object
      properties:
        postingRef:
          description: Идентификтор проводки
          type: string
          pattern: uuid
          nullable: false
          maxLength: 255
        conversationRate:
          $ref: "#/components/schemas/conversationRateDto"
        status: 
          description: Статус проводки
          type: string
          pattern: '^[a-zA-Z]+$'
          nullable: false
          maxLength: 255
          enum:
            - HOLD
            - SETTLED
        account: 
          $ref: '#/components/schemas/AccountDTO'

    conversationRateDto:
          description: Курсы валют
          type: array
          maxItems: 2
          minItems: 2
          nullable: false
          items: 
            properties:
              currency:
                description: Код валюты
                type: string
                pattern: '^[a-zA-Z]+$'
                nullable: false
                maxLength: 255
              amount:
                type: number
                format: float
                multipleOf: 0.01
                maximum: 1000000
                minimum: 0

    AccountDTO: 
          type: object
          nullable: false
          properties:
            account:
              description: Статус проводки
              type: string
              pattern: '^\d+$'
              nullable: false
              maxLength: 255
  # --- Стандартные ответы (п. 3.13) ---
  # Обязательный минимум:
  # BadRequest400, UnprocessableEntity422, NotFound404,
  # Conflict409, TooManyRequests429,
  # InternalServerError500, ServiceUnavailable503
  responses: {}