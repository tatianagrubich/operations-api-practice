extends: ["spectral:oas"]

rules:
  bank-paths-kebab-case:
    description: "Все статические сегменты путей API должны быть во множественном числе, нижнем регистре и разделяться дефисом (kebab-case). Допускаются префиксы версий (v1/v2)."
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^(\\/v[0-9]+)?(\\/[a-z0-9]+(-[a-z0-9]+)*|\\/{[a-zA-Z0-9]+})+$"

  bank-no-crud-in-paths:
    description: "В URL путей запрещено использовать CRUD-глаголы и RPC-стиль. Исключение: /apply-decision (п. 3.8 стандарта)."
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        notMatch: "\\/(get|create|update|delete|show|fetch|add)[A-Z]?([^\\/]*)"

  bank-no-trailing-slash:
    description: "Trailing slash в конце URL запрещен."
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        notMatch: ".+\\/$"

  bank-properties-camel-case:
    description: "Все JSON-атрибуты и query-параметры обязаны использовать lowerCamelCase."
    severity: error
    given: 
      - "$.components.schemas.*.properties.*~"
      - "$.paths[*].*.parameters[?(@.in == 'query')].name"
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][a-zA-Z0-9]*$"

  bank-schemas-upper-camel-case:
    description: "Названия схем (components/schemas) должны использовать UpperCamelCase."
    severity: error
    given: $.components.schemas.*~
    then:
      function: pattern
      functionOptions:
        match: "^[A-Z][a-zA-Z0-9]*$"

  bank-list-item-flat-structure:
    description: "Списочные схемы (ListItem) для SLA 150 мс не должны содержать глубоких вложенных объектов (максимум 2 уровня)."
    severity: warn
    given: "$.components.schemas[?(@property.match(/ListItem/))].properties.*.properties.*.properties"
    then:
      function: length
      functionOptions:
        max: 0

  bank-post-idempotency-key-required:
    description: "POST-методы обязаны содержать обязательный заголовок Idempotency-Key (п. 3.8)."
    severity: error
    given: $.paths[*].post.parameters[?(@.in == 'header' && @.name == 'Idempotency-Key')]
    then:
      field: required
      function: truthy

  bank-pagination-format:
    description: "Ответы списков должны соответствовать стандарту: массив data и объект paging (п. 3.10)."
    severity: error
    given: "$.components.schemas[?(@property.match(/Page|Response/))].properties"
    then:
      - field: data
        function: defined
      - field: paging
        function: defined

  bank-string-max-length-required:
    description: "Для всех полей string должна быть зафиксирована максимальная длина (maxLength), кроме дат и uuid."
    severity: error
    given: $.components.schemas..properties[?(@.type === 'string' && @.format !== 'date-time' && @.format !== 'uuid' && @.format !== 'date')]
    then:
      field: maxLength
      function: defined

  bank-numeric-limits-required:
    description: "Для числовых полей обязательны границы minimum и maximum."
    severity: error
    given: $.components.schemas..properties[?(@.type === 'number' || @.type === 'integer')]
    then:
      - field: minimum
        function: defined
      - field: maximum
        function: defined

  bank-no-invalid-decimal:
    description: "В OpenAPI 3.0 нет format: decimal. Используйте double или string с pattern для денег."
    severity: error
    given: "$..properties[?(@.format === 'decimal')]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            format:
              not:
                const: decimal

  bank-objects-no-additional-properties:
    description: "Для всех типов object обязательно указывать additionalProperties: false (ФЛК)."
    severity: error
    given: "$..[?(@.type === 'object' && @.properties)]"
    then:
      field: additionalProperties
      function: defined
      functionOptions:
        values: [false]

  bank-error-format:
    description: "Схема Error должна содержать code и title, и не должна содержать message (п. 3.13.2)."
    severity: error
    given: "$.components.schemas.Error.properties"
    then:
      - field: code
        function: defined
      - field: title
        function: defined
      - field: message
        function: undefined

  bank-account-masking-pattern-required:
    description: "Требование ИБ: поля с номерами счетов (accountNumber, maskedNumber, maskedAccount) обязаны валидироваться по шаблону маски (5 цифр + 11 звездочек + 4 цифры)."
    severity: error
    given: "$.components.schemas..properties[?(@property.match(/accountNumber|maskedNumber|maskedAccount/i))]"
    then:
      - field: pattern
        function: defined
      - field: pattern
        function: pattern
        functionOptions:
          match: '^\^[0-9]{5}\*{11}[0-9]{4}\$$'